<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Focus Room Controls</title>
  <link rel="stylesheet" href="/static/styles.css">
  <style>
    body { min-height: 100vh; padding: 42px; background: #101214; }
    .admin-page { width: min(720px, 100%); margin: auto; color: var(--paper); font-family: var(--display); }
    .admin-page h1 { margin-bottom: 8px; }
    .admin-intro { margin-bottom: 24px; color: var(--muted); }
    .admin-card { margin-top: 16px; padding: 22px; border: 1px solid var(--line); background: rgba(18,20,23,0.9); }
    .admin-card h2 { margin-bottom: 16px; }
    .admin-row { display: flex; flex-wrap: wrap; align-items: end; gap: 12px; }
    .admin-field { display: grid; gap: 7px; color: var(--muted); font: 11px var(--mono); }
    .admin-field input, .admin-page button { padding: 9px 10px; border: 1px solid var(--line); color: var(--paper); background: #15191b; font: inherit; }
    .admin-field input { width: 150px; }
    .admin-page button { border-color: var(--amber); color: var(--amber); cursor: pointer; }
    .admin-page button:hover { color: var(--ink); background: var(--amber); }
    .admin-goal { display: flex; align-items: center; gap: 10px; margin: 8px 0; color: var(--paper); }
    .admin-goal span { flex: 1; }
    .admin-goal button { padding: 4px 7px; border-color: var(--line); color: var(--muted); }
    .admin-status { margin-top: 18px; color: var(--mint); font: 11px var(--mono); }
  </style>
</head>
<body>
  <main class="admin-page">
    <p class="eyebrow">FOCUS ROOM / ADMIN ONLY</p>
    <h1>Overlay controls</h1>
    <p class="admin-intro">Only authenticated staff users can change the live overlay state.</p>
    <form id="csrfForm">{% csrf_token %}</form>
    <section class="admin-card">
      <h2>Timer settings</h2>
      <div class="admin-row">
        <label class="admin-field">Focus minutes<input id="studyMinutes" type="number" min="1" max="180"></label>
        <label class="admin-field">Total sessions<input id="totalSessions" type="number" min="1" max="24"></label>
        <button id="saveTimer" type="button">Save timer</button>
      </div>
    </section>
    <section class="admin-card">
      <h2>Visibility and BRB</h2>
      <div class="admin-row">
        <button data-visibility="study" type="button">Study</button>
        <button data-visibility="weekly" type="button">Weekly goals</button>
        <button data-visibility="daily" type="button">Daily goals</button>
        <button data-visibility="exercise" type="button">Exercise</button>
        <button id="showAll" type="button">Show all</button>
        <button id="brb" type="button">Be right back</button>
      </div>
    </section>
    <section class="admin-card">
      <h2>Weekly goals</h2>
      <div id="weeklyGoals"></div>
      <div class="admin-row"><input id="weeklyInput" maxlength="30" placeholder="New weekly goal"><button id="addWeekly" type="button">Add</button></div>
    </section>
    <section class="admin-card">
      <h2>Daily goals</h2>
      <div id="dailyGoals"></div>
      <div class="admin-row"><input id="dailyInput" maxlength="30" placeholder="New daily goal"><button id="addDaily" type="button">Add</button></div>
    </section>
    <p id="status" class="admin-status">Loading...</p>
  </main>
  <script>
    let state;
    const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;
    const status = document.querySelector('#status');
    async function load() {
      const response = await fetch('/api/state/', { cache: 'no-store' });
      state = await response.json();
      render();
    }
    async function save() {
      const response = await fetch('/api/state/update/', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrfToken }, body: JSON.stringify(state) });
      if (!response.ok) { status.textContent = 'Save failed. Please log in again.'; return; }
      state = await response.json(); render();
    }
    function renderGoals(id, key) {
      const host = document.querySelector(`#${id}`); host.innerHTML = '';
      (state[key] || []).forEach((goal, index) => {
        const row = document.createElement('div'); row.className = 'admin-goal';
        row.innerHTML = `<span>${goal.done ? '✓ ' : ''}${goal.text}</span><button type="button">${goal.done ? 'Undo' : 'Done'}</button><button type="button">Delete</button>`;
        row.children[1].onclick = () => { state[key][index].done = !state[key][index].done; save(); };
        row.children[2].onclick = () => { state[key].splice(index, 1); save(); };
        host.appendChild(row);
      });
    }
    function render() {
      document.querySelector('#studyMinutes').value = state.studyMinutes;
      document.querySelector('#totalSessions').value = state.totalSessions;
      renderGoals('weeklyGoals', 'weeklyGoals'); renderGoals('dailyGoals', 'dailyGoals');
      const visibility = state.visibility || {};
      document.querySelectorAll('[data-visibility]').forEach((button) => { const key = button.dataset.visibility; button.textContent = `${key}: ${visibility[key] !== false ? 'on' : 'off'}`; });
      document.querySelector('#brb').textContent = state.brb ? 'Hide BRB' : 'Show BRB';
      status.textContent = 'Saved state is live on the overlay.';
    }
    document.querySelector('#saveTimer').onclick = () => { state.studyMinutes = Number(document.querySelector('#studyMinutes').value); state.totalSessions = Number(document.querySelector('#totalSessions').value); save(); };
    document.querySelectorAll('[data-visibility]').forEach((button) => button.onclick = () => { const key = button.dataset.visibility; state.visibility[key] = state.visibility[key] === false; save(); });
    document.querySelector('#showAll').onclick = () => { state.visibility = { study: true, weekly: true, daily: true, exercise: true }; save(); };
    document.querySelector('#brb').onclick = () => { state.brb = !state.brb; save(); };
    document.querySelector('#addWeekly').onclick = () => { const input = document.querySelector('#weeklyInput'); if (input.value.trim()) { state.weeklyGoals.push({ text: input.value.trim(), done: false }); input.value = ''; save(); } };
    document.querySelector('#addDaily').onclick = () => { const input = document.querySelector('#dailyInput'); if (input.value.trim()) { state.dailyGoals.push({ text: input.value.trim(), done: false }); input.value = ''; save(); } };
    load();
  </script>
</body>
</html>
